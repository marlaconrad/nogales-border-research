
name: Collect Nogales border observations

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nogales-border-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect readings
        run: python collect_border_data.py

      - name: Analyze data quality
        run: python analyze_data_quality.py

      - name: Commit updated data and reports
        run: |
          git add data/nogales_border_observations.csv
          git add reports/data_quality_detail.csv
          git add reports/data_quality_summary.csv

          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update CBP observations and data-quality reports"
            git push
          else
            echo "No changes to commit."
          fi
